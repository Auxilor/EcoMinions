name: "&eExample Upgrade"

display:
  icon: redstone

# Effects are authored once and shared by every tier.
# %tier_value% resolves to the `value` of whichever tier the minion owns,
# and %tier% resolves to the tier number itself.
effects:
  # A minion-specific effect: makes the minion mine faster.
  - id: minion_speed
    args:
      ticks_faster: "%tier_value%"

  # Any stock libreforge effect works too, as long as you give it a trigger.
  # - id: multiply_drops
  #   triggers: [minion_mine_block]
  #   args:
  #     multiplier: "1 + %tier_value%"

tiers:
  1:
    value: 5
    stat-delta: "-5 ticks"
    cost-options:
      - { value: 1000, type: vault }
      - { value: 32, type: stone }

  2:
    value: 10
    stat-delta: "-10 ticks"
    cost-options:
      - { value: 50, type: gems }
      - { value: 5000, type: vault }

  3:
    value: 15
    stat-delta: "-15 ticks"
    cost-options:
      - { value: 25000, type: vault }
