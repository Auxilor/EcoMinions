# The ID of the definition is the name of the .yml file,
# for example oak.yml has the ID of oak.
# _example.yml is not loaded.
#
# This folder starts empty, and that is normal.
#
# Vanilla Minecraft is already built in: the plugin knows every tree's sapling
# and leaves, that wheat sits on farmland, that cactus is cut at its base, and
# which blocks break too badly for a minion to touch. A block with no file here
# is handled by that, plus the minion's own 'type:'.
#
# Write a file here only to:
#   - describe a custom block from ItemsAdder, Oraxen, Nexo or CraftEngine
#   - change a built-in default (a file wins over the built-in definition for
#     the same block)
#   - override what a minion's type would otherwise do, with 'restore:' below

# The block this definition describes.
# Any block id eco understands, including custom blocks from
# ItemsAdder, Oraxen, Nexo and CraftEngine.
block: OAK_LOG

# (Optional) Overrides the minion type's behaviour for this one block:
#   regen   - put back exactly as it was
#   replant - placed again as a young plant, and left to ripen
#   tree    - felled, and a sapling planted to grow a new one
# Leave it out and the minion's own 'type:' decides, which is almost
# always what you want: the same oak log is felled by a woodcutter and
# regenerated by a miner, with no override needed for either.
# restore: tree

# What is planted to bring this block back. A woodcutter plants this as a
# sapling; a farmer replants it as a crop. Required by 'replant' and 'tree'.
plant: OAK_SAPLING

# The canopy of the grown tree. Required by woodcutters and by 'tree'.
leaves: OAK_LEAVES

# (Optional) What must be underneath for the minion to plant here.
# Leave it out to accept any solid block.
surface: GRASS_BLOCK

# (Optional) Which built-in tree shape to grow:
#   oak, jungle, pale_oak, mangrove - a standard broadleaf
#   birch                           - narrow, taller canopy
#   spruce                          - a conifer, narrowing to the top
#   acacia                          - one wide flat slab
#   dark_oak, cherry                - the widest canopy
# Defaults to this definition's ID, falling back to a generic small tree,
# so a custom log needs this set or it grows the plain shape.
# tree-pattern: oak

# (Optional) Whether a minion may target this block at all. Defaults to true.
# Set it false for blocks that break badly - amethyst buds, dripstone, vines -
# so no minion can be configured onto them however it is written.
# mineable: false

# (Optional) Whether this block grows upward in a column, like sugar cane or
# bamboo. A minion only ever cuts a column at its base, taking the whole stack
# in one action. Defaults to false.
# stacked-column: true

# (Optional) What targeting this block really means. A minion configured to
# target seeds should mine the grown crop, so the seed promotes to it.
# promotes-to: WHEAT

# (Optional) What the minion gets for this block, live and during offline catch-up.
# Only needed for custom blocks. Live mining already uses the drops of an EcoItems
# block; set this for other plugins' blocks, or to override them. Offline catch-up
# always needs it, as a custom block's drops cannot be rolled while nobody is online.
# drops:
#   - "itemsadder:ruby"
