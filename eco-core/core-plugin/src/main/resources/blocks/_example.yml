# The ID of the definition is the name of the .yml file.
# For example oak.yml has the ID of oak.
# _example.yml is not loaded.
#
# This folder starts empty, and that is normal.
#
# Vanilla is already built in: the plugin knows every tree's sapling and
# leaves, that wheat sits on farmland, that cactus is cut at its base, and
# which blocks break too badly for a minion to touch. A block with no file
# here uses that, plus the minion's own type.
#
# Write a file here only to:
# - describe a custom block from ItemsAdder, Oraxen, Nexo or CraftEngine.
# - change a built-in default. A file wins over the built-in definition for the same block.
# - force what a minion does with this block, with restore below.

# The block this definition describes. Any block id, including custom blocks
# from ItemsAdder, Oraxen, Nexo and CraftEngine. Required.
block: OAK_LOG

# (Optional) Forces what a minion does with this one block, whatever its type.
# regen: put back exactly as it was.
# replant: planted again as a young plant, and left to ripen.
# tree: felled, and a sapling planted to grow a new one.
# Leave it out and the minion's type decides, which is almost always right:
# the same oak log is felled by a woodcutter and regenerated by a miner.
# restore: tree

# What is planted to bring this block back. A woodcutter plants it as a
# sapling, and a farmer replants it as a crop. Required by replant and tree.
plant: OAK_SAPLING

# The canopy of the grown tree. Required by woodcutters and by tree.
leaves: OAK_LEAVES

# (Optional) What must be underneath for the minion to plant here. It is also
# put back under the block when it regenerates, unless the minion sets
# placement.lift-regen itself. Leave it out to accept any solid block.
surface: GRASS_BLOCK

# (Optional) Which built-in tree shape to grow.
# oak, jungle, pale_oak, mangrove: a standard broadleaf.
# birch: narrow, with a taller canopy.
# spruce: a conifer, narrowing to the top.
# acacia: one wide flat slab.
# dark_oak, cherry: the widest canopy.
# Defaults to this definition's ID, falling back to a small plain tree,
# so a custom log needs this set to get a real shape.
# tree-pattern: oak

# (Optional) If a minion may target this block at all. Defaults to true.
# Set it false for blocks that break badly, such as amethyst buds, dripstone
# and vines, so no minion can be set up to target them.
# mineable: false

# (Optional) If this block grows upward in a column, like sugar cane or
# bamboo. A minion only ever cuts a column at its base, taking the whole stack
# in one action. Defaults to false.
# stacked-column: true

# (Optional) The block a minion really works when it targets this one, e.g.
# BAMBOO_SAPLING promotes to BAMBOO.
# promotes-to: BAMBOO

# (Optional) What one break gives the minion, live and during offline catch-up.
# Only needed for custom blocks. Live mining already uses the drops of an
# EcoItems block; set this for other plugins' blocks, or to override them.
# Offline catch-up always needs it, as a custom block's drops cannot be rolled
# while nobody is online.
# drops:
#   - "itemsadder:ruby"

# (Optional) The XP one break is worth, as a whole number or a range like 2-5.
# Vanilla ores already have their vanilla XP.
# xp: 2-5
