# The ID of the minion type is the name of the .yml file,
# for example wood.yml has the ID of wood
# You can place minion types anywhere in this folder,
# including in subfolders if you want to organize your configs
# _example.yml is not loaded.

name: "&fExample Minion"

# Blocks this minion mines. If every entry is a log of the same tree
# (e.g. all OAK_LOG), the minion is detected as that tree's wood family and
# only ever mines that log - crops aren't auto-promoted for it. Otherwise any
# configured seed/crop is promoted to its grown form automatically.
target-blocks:
  - STONE
  - COBBLESTONE

# Every stat here may be a plain number or a %level%-scaled expression, e.g.
# "max(1, 60 - %level% * 2)". max-storage-slots is rounded rather than
# truncated, and is always clamped to config.yml's minion.hard-slot-cap,
# however high a formula pushes it.
base-stats:
  speed-ticks: 60
  efficiency-ticks: 10
  radius: 3
  # Vertical span of the mining box in blocks, measured from one block below
  # the minion upward. Defaults to 3 (one below, level, one above). Raise it for
  # tall targets such as trees. Supports %level% expressions like the stats above.
  height: 3
  storage-slots: 27
  max-storage-slots: 54
  regen-delay-ticks: 100

# Levelling is opt-in. With it off (or this block removed) a minion's level is
# the sum of its purchased upgrade tiers, plus one.
# levelling:
#   enabled: true
#   xp-formula: "100 * %level% ^ 1.5"
#   # or an explicit ladder - the first entry is the cost of reaching level 2:
#   # xp-requirements: [100, 250, 500]
#   max-level: 50
#   xp-gain-methods:
#     - trigger: minion_mine_block
#       multiplier: 1
#     - trigger: minion_sell
#       multiplier: 0.05
#   level-up-effects:
#     - id: send_message
#       conditions: [{ id: minion_owner_online }]
#       args:
#         message: "&aYour minion reached level %level%!"

# Effects that are always active on this minion type, with no upgrade needed.
# Any libreforge effect works; minion-specific ones are listed in the docs.
# effects:
#   - id: minion_radius
#     args:
#       blocks: 1
#   - id: multiply_drops
#     triggers:
#       - minion_mine_block
#     args:
#       multiplier: 1.5

spawn-item:
  # An eco item lookup - a vanilla material, a custom item, a #tag, or a
  # player head via "player_head texture:<base64>".
  item: "STONE"
  display-name: "&fExample Minion &7(Lvl %level%)"
  lore:
    - "&7Replace this with your description"
    - "&7Level: &f%level%"
  crafting:
    enabled: false
    give-amount: 1
    # (optional) permission required to see/use the recipe - blank allows everyone
    permission: ""
    shapeless: false
    # Flat nine-entry grid, eco item lookups - an empty string is an empty slot
    recipe:
      - "STONE"
      - "STONE"
      - "STONE"
      - "STONE"
      - "ARMOR_STAND"
      - "STONE"
      - "STONE"
      - "STONE"
      - "STONE"

# What the minion's stand wears/holds - each slot is an eco item lookup
# string, so custom items and #tags work same as everywhere else. Every
# slot is optional: a missing hand falls back to an iron pickaxe, and the
# rest are simply left bare.
equipment:
  # helmet: ""   # omit to default to this minion's own spawn-item icon,
  #              # worn on its head - the same item as spawn-item.item above
  chestplate: "LEATHER_CHESTPLATE"
  leggings: "LEATHER_LEGGINGS"
  boots: "LEATHER_BOOTS"
  # hand: ""     # omit to default to an iron pickaxe

# lift-regen picks the block back up as a surface (e.g. farmland, the
# sapling's dirt) when the minion is placed, and puts it back on pickup.
# Left off, trees and crops default this on automatically from their target
# blocks; anything else defaults it off.
#
# self-seed lets the minion supply its own blocks: whenever it has nothing to
# mine, it places seed-block on the nearest air spot in range that has a valid
# surface beneath it. Left off, a player must place the starting blocks.
# Tree types default it on, everything else defaults it off.
placement:
  lift-regen: false
  surface-block: ""
  self-seed: false
  # seed-block: ""   # omit to seed the block this minion mines

particles:
  # `particle` is an eco particle string: a particle name like `flame`, or a
  # factory form like `dust:ff5050` or `dust_transition:ff0000:0000ff`.
  # `count` particles are spawned per burst, scattered within `offset` blocks.
  full:
    enabled: true
    particle: "angry_villager"
    interval-ticks: 20
    count: 4
    offset: 0.4
    nearby-player-radius: 16
  # Shown instead of the full-storage particles while the minion is idle
  # (its owner is offline), and only when a player is nearby to see it.
  idle:
    enabled: false
    particle: "smoke"
    interval-ticks: 20
    count: 2
    offset: 0.3
    nearby-player-radius: 16
  # Traces a wireframe box around the mining area while the minion has nothing
  # to mine, so its owner can see what needs clearing. Sized from radius and
  # height above. Shown to the owner alone, never to other players.
  blocked:
    enabled: true
    particle: "dust:ff5050"
    interval-ticks: 20
    count: 1
    offset: 0.0
    nearby-player-radius: 16

# Prices for auto_sell, keyed by material. Leave empty (or omit entirely) to
# fall back to config.yml's sell-pricing.auto-from-ecoshop, if it's on.
sell-prices:
  STONE: 1.0
  COBBLESTONE: 1.0

# IDs of upgrades this type may purchase, each matching a filename in
# upgrades/ (see upgrades/_example.yml). auto_sell only pays out if
# sell-prices above has entries, or EcoShop auto-pricing is enabled.
allowed-upgrades:
  - speed
  - efficiency
  - fortune
  - radius
  - height
  - capacity
  - auto_smelt
  - auto_sell
  - experience

# (optional) IDs of compactor recipes this type may buy, each matching a
# filename in compactor-recipes/ (see compactor-recipes/_example.yml). Listed
# order is the order the compactor menu upgrades through, e.g. coal before
# coal_block. Buying one also implicitly allows its upgrade, so it need not
# be repeated in allowed-upgrades above.
# compactor-recipes:
#   - stone_block
