# The ID of the minion is the name of the .yml file.
# For example wood.yml has the ID of wood.
# You can place minions anywhere in this folder,
# including in subfolders if you want to organise your configs.
# _example.yml is not loaded.

name: "&fExample Minion" # The name shown on its hologram and item.

# What this minion does with its turn. Required.
# miner: breaks the block and puts it back after the regen delay.
# woodcutter: fells the tree, plants a sapling, and waits for it to grow.
# farmer: harvests the ripe crop and replants it.
# slayer: kills mobs in its area. See target-mobs below.
# fishing: catches from water in its area. See min-water below.
# collector: picks up dropped items and XP orbs. See target-items below.
# feeder: refuels nearby minions from fuel players put in its storage. See fuels below.
# breeder: breeds nearby animals with food players put in its storage. See food below.
# A block definition in blocks/ can force a behaviour for one block with restore.
type: miner

# If true, this minion is placed and works where its owner cannot build, in
# claims, islands and protected regions. Leave it false unless only admins can
# get this minion.
bypass-antigrief: false

# (Optional) The most of this minion each player can place. Leave it out for no cap.
# The permission ecominions.minion-limit.<minion id>.<number> can raise it.
# limit: 2

# The blocks this minion works, for miners, farmers and woodcutters.
# A woodcutter lists its log here. A farmer lists the crop block, e.g. WHEAT or
# BEETROOTS, not the seed item.
target-blocks:
  - STONE
  - COBBLESTONE

# Every stat may be a plain number or an expression in %level%, such as
# "max(1, 60 - %level% * 2)". The slot stats are always capped by
# minion.hard-slot-cap in config.yml, however high a formula goes.
base-stats:
  speed-ticks: 60 # Ticks between actions.
  efficiency-ticks: 10 # Extra ticks each action takes.
  radius: 3 # How far the work area reaches sideways, in blocks.
  # How tall the work area is, in blocks, counted up from placement.floor-offset.
  # Leave it out for the type's default: miner 1, farmer 1, woodcutter 5,
  # slayer 3, fishing 1, collector 3, feeder 3, breeder 3.
  height: 1
  storage-slots: 27 # Stack slots in its storage.
  max-storage-slots: 54 # The most slots capacity upgrades can reach.
  regen-delay-ticks: 100 # How long a broken block takes to come back.

# (Optional) Levelling. Without it, a minion's level is the number of upgrade
# tiers it owns, plus one.
# levelling:
#   enabled: true
#   xp-formula: "100 * %level% ^ 1.5"
#   # Or a list of costs. The first entry is the cost of reaching level 2.
#   # xp-requirements: [100, 250, 500]
#   max-level: 50
#   xp-gain-methods:
#     - trigger: minion_mine_block
#       multiplier: 1
#     - trigger: minion_sell
#       multiplier: 0.05
#   level-up-effects:
#     - id: send_message
#       conditions: [{ id: minion_owner_online }]
#       args:
#         message: "&aYour minion reached level %level%!"

# (Optional) Effects that are always active on this minion, with no upgrade needed.
# Any libreforge effect works. The minion effects are listed on the EcoMinions wiki.
# effects:
#   - id: minion_radius
#     args:
#       blocks: 1
#   - id: multiply_drops
#     triggers:
#       - minion_mine_block
#     args:
#       multiplier: 1.5
# (Optional) Conditions that must pass for the effects above to be active.
# conditions: []

spawn-item:
  # The item it is placed from. Any item lookup: a vanilla item, a custom
  # item, a #tag, or a player head with "player_head texture:<base64>".
  item: "STONE"
  display-name: "&fExample Minion &7(Lvl %level%)" # The item name.
  lore: # The item lore.
    - "&7Replace this with your description"
    - "&7Level: &f%level%"
  crafting:
    enabled: false # If the minion has a crafting recipe.
    give-amount: 1 # How many minions the recipe makes.
    permission: "" # (Optional) The permission needed to craft it. Blank allows everyone.
    shapeless: false # If true, slot positions don't matter.
    recipe: # The 3x3 recipe ingredients, use "" for empty slots.
      - "STONE"
      - "STONE"
      - "STONE"
      - "STONE"
      - "ARMOR_STAND"
      - "STONE"
      - "STONE"
      - "STONE"
      - "STONE"

# What the minion's armour stand wears and holds. Every slot is an optional
# item lookup. Set a slot to "" to leave it bare.
equipment:
  # helmet: "" # Leave out to wear the spawn item on its head.
  chestplate: "LEATHER_CHESTPLATE"
  leggings: "LEATHER_LEGGINGS"
  boots: "LEATHER_BOOTS"
  # hand: "" # Leave out to hold an iron pickaxe.

# Optional. A ModelEngine or BetterModel model shown instead of the armour
# stand. Leave the id blank to keep the armour stand.
model:
  plugin: "model-engine" # Either model-engine or better-model.
  id: "" # The model id in that plugin.
  animations: # Optional. Each animation loops while the minion is in that state.
    idle: "" # While it is making its own work, such as placing a block to mine.
    working: "" # While it is working.
    full: "" # While its storage is full.
    offline: "" # While it is inactive, such as when its owner and island members are offline or a limit holds it back. Blank plays idle.
    blocked: "" # While it has nothing to work on. Blank plays idle.

placement:
  # If true, surface-block is put back under a block when it regenerates, such
  # as farmland under wheat. Left out, it is on when a target block has a
  # surface in blocks/, as crops and trees do.
  lift-regen: false
  surface-block: "" # The block put back under a regenerating block. Required when lift-regen is on.
  # If true, the minion makes its own work when it has nothing to do: it places
  # blocks, spawns mobs or lays water, as its type does. Left out, it is on for
  # woodcutters and slayers, and off for the rest.
  self-seed: false
  # seed-block: "" # What self-seeding places. Leave out to seed each target's plant, or the target itself.
  # Empty blocks self-seeding keeps between plants, in each straight direction.
  # 0 packs them side by side. Use 1 for cactus and 2 for trees.
  spacing: 0
  # (Optional) The first layer of the work area, relative to the minion.
  # Defaults: miner -1, farmer 0, woodcutter 0, slayer 0, fishing -1, collector -1.
  # floor-offset: -1

# Each layer takes an eco particle, such as flame or dust:ff5050, and spawns
# count particles per burst, spread within offset blocks.
particles:
  full: # Shown while its storage is full.
    enabled: true
    particle: "angry_villager"
    interval-ticks: 20 # How often a burst is shown.
    count: 4 # Particles per burst.
    offset: 0.4 # How far the particles spread, in blocks.
    nearby-player-radius: 16 # Only shown when a player is this close.
  idle: # Shown while the minion is idle, instead of full.
    enabled: false
    particle: "smoke"
    interval-ticks: 20
    count: 2
    offset: 0.3
    nearby-player-radius: 16
  blocked: # A box around the work area while there is nothing to work on. Only the owner sees it.
    enabled: true
    particle: "dust:ff5050"
    interval-ticks: 20
    count: 1
    offset: 0.0
    nearby-player-radius: 16

# What each stored item sells for, keyed by the item, not the block it came from.
# Custom item ids work too. Items with no price here use EcoShop, if
# sell-pricing.auto-from-ecoshop is on in config.yml.
sell-prices:
  STONE: 1.0
  COBBLESTONE: 1.0
  # "itemsadder:ruby": 100.0

# The upgrades this minion can buy, by ID from upgrades/.
# auto_sell only pays for items that have a price.
allowed-upgrades:
  - speed
  - efficiency
  - fortune
  - radius
  - height
  - capacity
  - auto_smelt
  - auto_sell
  - experience

# (Optional) The compactor recipes this minion can buy, by ID from
# compactor-recipes/, in menu order. They need no entry in allowed-upgrades,
# but only run with a minion_compact effect in effects above.
# compactor-recipes:
#   - coal_block

# Collectors (type: collector) pick up dropped items and XP orbs.
# The item ids to collect. Empty collects everything.
# target-items: []
# If XP orbs are absorbed into stored XP.
# collect-xp: true

# Slayers (type: slayer) kill mobs in their area.
# The mobs to kill: vanilla types, with arguments like 'zombie baby', or custom mobs like 'ecomobs:tank_zombie'.
# target-mobs:
#   - zombie
# The most mobs it keeps spawned at once when self-seeding. May use %level%.
# max-mobs: 4
# If kills count as the owner's while they are online: vanilla player-kill loot
# drops, and the owner's own kill effects fire. Off by default.
# credit-owner: false
# Replaces what the mob drops. Same fields as EcoItems loots.
# drops:
#   - item: rotten_flesh
#     chance: 1
#     amount: 1-2
#     xp: 1-3

# Feeders (type: feeder) refuel nearby minions from fuel players put in their storage.
# The fuel ids it may use. Empty uses every fuel.
# fuels: []

# Breeders (type: breeder) breed nearby animals with food players put in their storage.
# The animals to breed: vanilla types, or custom mobs like 'ecomobs:tank_zombie'. Required.
# target-mobs:
#   - cow
# The items it accepts as food. Required. An animal only breeds with food it eats in vanilla.
# food:
#   - WHEAT
# The most target animals in its area, babies included, before it stops breeding. May use %level%.
# max-mobs: 8

# Fishing minions (type: fishing) catch from water source blocks in their area.
# The water source blocks needed before it fishes.
# min-water: 1
# Replaces the vanilla catch table. Same fields as EcoItems loots.
# drops:
#   - item: cod
#     chance: 0.6
