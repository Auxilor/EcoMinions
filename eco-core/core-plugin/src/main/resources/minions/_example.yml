name: "&fExample Minion"

target-blocks:
  - STONE
  - COBBLESTONE

base-stats:
  speed-ticks: 60
  efficiency-ticks: 10
  radius: 3
  inventory-rows: 3
  regen-delay-ticks: 100

# Effects that are always active on this minion type, with no upgrade needed.
# Any libreforge effect works; minion-specific ones are listed in the docs.
# effects:
#   - id: minion_radius
#     args:
#       blocks: 1
#   - id: multiply_drops
#     triggers: [minion_mine_block]
#     args:
#       multiplier: 1.5

spawn-item:
  mode: item
  item: "STONE"
  display-name: "&fExample Minion &7(Lvl %level%)"
  lore:
    - "&7Replace this with your description"
    - "&7Level: &f%level%"
  crafting:
    enabled: false
    give-amount: 1
    permission: ""
    shapeless: false
    recipe:
      - "STONE"
      - "STONE"
      - "STONE"
      - "STONE"
      - "ARMOR_STAND"
      - "STONE"
      - "STONE"
      - "STONE"
      - "STONE"

placement:
  lift-regen: false
  surface-block: ""

particles:
  full:
    enabled: true
    type: ANGRY_VILLAGER
    interval-ticks: 20
    count: 4
    offset: 0.4
    speed: 0.0
    nearby-player-radius: 16
  # Shown instead of the full-storage particles while the minion is idle
  # (its owner is offline), and only when a player is nearby to see it.
  idle:
    enabled: false
    type: SMOKE
    interval-ticks: 20
    count: 2
    offset: 0.3
    speed: 0.0
    nearby-player-radius: 16

sell-prices:
  STONE: 1.0
  COBBLESTONE: 1.0

allowed-upgrades:
  - speed
  - efficiency
  - fortune
  - radius
  - capacity
  - auto_smelt
  - auto_sell
  - experience
