#
# EcoMinions
# by Auxilor
#

# Worlds that EcoMinions should be disabled in.
disabled-in-worlds: []

limits:
  # What happens when a placement would go past any limit below.
  # prevent: the placement is refused.
  # inactive: the minion is placed, and the newest-placed minions over the limit stay idle until there is room.
  over-limit: prevent
  per-player:
    enabled: true # If players have a cap on placed minions.
    default: 5 # The cap for every player.
    permission-overrides: true # If ecominions.limit.<number> can raise a player's cap.
  per-island:
    enabled: false # If islands have a cap on placed minions. Needs an island plugin.
    default: 10 # The cap for every island.
    permission-overrides: true # If ecominions.island-limit.<number> on the island owner can raise the island's cap.
  per-type:
    enabled: false # If each player has a cap per minion type.
    permission-overrides: true # If ecominions.type-limit.<type>.<number> can raise a player's cap for that type.
    types: # The cap for each type. A type left out has no cap.
      miner: 10
      farmer: 10

islands:
  privileges: true # If island ranks decide who may place, use and pick up minions. Needs an island plugin.
  active-while-member-online: false # If a minion on an island keeps working while any island member is online, not only its owner.

# A minion is idle while its owner is offline or its chunk is unloaded.
# When it wakes up, the idle time is simulated and paid out in one go.
unloaded-calculation:
  enabled: true # If idle time is paid out at all.
  offline-efficiency: 1.0 # Multiplier on simulated drops. 1.0 is the live rate, 0.75 is 75% of it.

sell-pricing:
  auto-from-ecoshop: true # If items with no sell-prices entry use the EcoShop sell price. Needs EcoShop.
  sell-price-multiplier: 1.0 # Scales EcoShop prices only. A minion's own sell-prices are never scaled.

minion:
  hologram-offset: 1.6 # How far above the minion the hologram floats, in blocks.
  hologram-refresh-ticks: 20 # How often the hologram updates, in ticks.
  invulnerable: true # If the minion's armour stand cannot be damaged.

  show-regen-marker: true # If a block waiting to regenerate shows as cobblestone. If false, it is air until it regenerates.
  regen-marker-fallback-block: AIR # Replaces any cobblestone markers left when a minion is picked up.

  # What happens to the blocks a minion placed (seeded ores and crops, saplings,
  # grown trees and the water it laid) when it is picked up or removed.
  # mine: they stay in the world for players to mine.
  # clear: they are removed, unless a player has since replaced them.
  seeded-blocks-on-pickup: mine

  # The most storage-slots and max-storage-slots any minion can have.
  # Minion storage is never opened as a chest, so this only guards against
  # typos. Raise it if your minions need more.
  hard-slot-cap: 54

  xp:
    # Where the XP a minion earns goes.
    # store: kept on the minion and claimed from its menu.
    # orb: dropped as an orb at the minion.
    mode: store

# The layout of each menu.
# A button's item and location are set here, and its name and lore in lang.yml.
# A location is a row and a column, counted from the top left corner, which is row 1, column 1.
# An area is the rectangle from its top-left slot to its bottom-right slot.
# If you change rows, move the locations and areas so they still fit in the menu.
# A mask pattern needs exactly one line for each row, or the menu will not open.
gui:
  main: # A minion's own menu.
    title: "&8%minion_name% &8(&7Lvl %level%&8)"
    rows: 6
    storage-display: lore # How stored item counts are shown: title, lore or both.
    storage-slots: 9 # The most item types shown in the storage area, highest count first.
    show-stored-xp: true # If the stored XP button is shown.
    # The background. Each digit in pattern is the item at that position in items, and 0 is empty.
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
    custom-slots: [] # Extra items placed in the menu, each with an item, a location and optional click actions.
    title-item: # The minion itself, at the top.
      item: player_head
      location:
        row: 1
        column: 5
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    storage-area: # Where the stored items are shown. Empty slots show the filler item from lang.yml.
      top-left:
        row: 2
        column: 2
      bottom-right:
        row: 5
        column: 8
    collect-all: # Moves every stored item into the player's inventory.
      item: hopper
      location:
        row: 6
        column: 2
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    limit: # Says which limit holds an idle minion back. Only shown when a limit is on. Its item is a barrier while idle and paper otherwise.
      location:
        row: 6
        column: 3
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    fuel: # Adds fuel. While fuel burns, it shows that fuel's item instead.
      item: coal
      location:
        row: 6
        column: 4
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    pickup: # Picks the minion up.
      item: barrier
      location:
        row: 6
        column: 5
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    stored-xp: # Claims the stored XP.
      item: experience_bottle
      location:
        row: 6
        column: 6
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    upgrades: # Opens the minion's upgrades.
      item: anvil
      location:
        row: 6
        column: 7
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    info: # Shows the minion's stats.
      item: book
      location:
        row: 6
        column: 8
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
  upgrade: # One upgrade's tiers.
    title: "&8Upgrade: &f%upgrade_name%"
    rows: 6
    # The background. Each digit in pattern is the item at that position in items, and 0 is empty.
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
    custom-slots: [] # Extra items placed in the menu, each with an item, a location and optional click actions.
    title-item: # The upgrade's icon. Its item is the upgrade's own icon.
      location:
        row: 1
        column: 5
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    tier-area: # Where the tiers are shown, lowest first. Tiers that do not fit are not shown.
      top-left:
        row: 2
        column: 2
      bottom-right:
        row: 5
        column: 8
    back: # Goes back to the upgrade list.
      item: arrow
      location:
        row: 6
        column: 1
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
  type-select: # The minion browser opened by /minions.
    title: "&8Choose a Minion"
    rows: 6
    # The background, set on every page. Each digit in pattern is the item at that position in items, and 0 is empty.
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "000000000"
        - "000000000"
        - "000000000"
        - "000000000"
        - "000000000"
        - "000000000"
    custom-slots: [] # Extra items placed in the menu, each with an item, a location and optional click actions.
    type-area: # Where the minions are shown. Minions that do not fit go on the next page.
      top-left:
        row: 2
        column: 2
      bottom-right:
        row: 5
        column: 8
    previous-page: # Goes to the previous page. Hidden on the first page.
      item: arrow
      location:
        row: 6
        column: 1
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
    next-page: # Goes to the next page. Hidden on the last page.
      item: arrow
      location:
        row: 6
        column: 9
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
  upgrade-list: # A minion's upgrades.
    title: "&8Upgrades: &f%minion_name%"
    rows: 6
    # The background. Each digit in pattern is the item at that position in items, and 0 is empty.
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
    custom-slots: [] # Extra items placed in the menu, each with an item, a location and optional click actions.
    upgrade-area: # Where the upgrades are shown. Upgrades that do not fit are not shown.
      top-left:
        row: 2
        column: 2
      bottom-right:
        row: 5
        column: 8
    back: # Goes back to the minion's menu.
      item: arrow
      location:
        row: 6
        column: 1
      locations: [ ] # Optional list of rows and columns; if set, the button shows in each of them instead of location
  cost-select: # The payment chooser.
    title: "&8Choose Payment"
    rows: 3
    # The background. Each digit in pattern is the item at that position in items, and 0 is empty.
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
    custom-slots: [] # Extra items placed in the menu, each with an item, a location and optional click actions.
    option-row: 2 # The row the payment options are shown in, from column 2 to column 8.
