name: ${pluginName}
version: ${version}
main: com.exanthiax.ecominions.EcoMinionsPlugin
api-version: "1.21"
folia-supported: true
authors: [Auxilor, Exanthiax, Callum]
depend:
  - eco
softdepend:
  - EcoItems
  - EcoShop
  - SuperiorSkyblock2
  - BentoBox
  - IridiumSkyblock
commands:
  minions:
    aliases: [minion, ecominions]
    description: Opens the minion menu
    permission: ecominions.command.minions
    default: true
permissions:
  ecominions.*:
    description: All ecominions permissions
    default: op
    children:
      ecominions.command.*: true
      ecominions.admin: true
  ecominions.command.*:
    description: All commands
    default: op
    children:
      ecominions.command.minions: true
      ecominions.command.open: true
      ecominions.command.give: true
      ecominions.command.reload: true
      ecominions.command.remove: true
      ecominions.command.info: true
  ecominions.command.minions:
    description: Allows the use of /minions.
    default: true
  ecominions.command.open:
    description: Allows the use of /minions open.
    default: true
  ecominions.command.give:
    description: Allows the use of /minions give.
    default: op
  ecominions.command.reload:
    description: Allows reloading the config
    default: op
  ecominions.command.remove:
    description: Allows the use of /minions remove.
    default: op
  ecominions.command.info:
    description: Allows the use of /minions info.
    default: op
  ecominions.admin:
    description: Bypasses minion limits and ownership checks.
    default: op
